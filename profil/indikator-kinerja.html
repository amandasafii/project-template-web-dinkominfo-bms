<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indikator Kinerja Utama - Dinkominfo Banyumas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --primary: #003d99;
      --primary-light: #0052cc;
      --accent: #0066ff;
      --text: #1a1a1a;
      --text-light: #666666;
      --bg: #ffffff;
      --bg-light: #f8f9fb;
      --card: #ffffff;
      --border: #e0e0e0;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
      --radius: 0.75rem;
      --transition: all 0.3s ease;
    }

    [data-theme="dark"] {
      --text: #f5f5f5;
      --text-light: #b0b0b0;
      --bg: #0f1117;
      --bg-light: #161b22;
      --card: #1c2128;
      --border: #30363d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: var(--transition);
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    @media (max-width: 768px) {
      .container { padding: 0 1rem; }
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      text-align: center;
      padding: 5rem 1rem;
      min-height: 50vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
      animation: pulse 10s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 0.5; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      z-index: 1;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 2rem; }
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto 2rem;
      z-index: 1;
    }

    /* Content Section */
    .content-section {
      padding: 4rem 0;
      background: var(--bg-light);
    }

    .performance-content {
      max-width: 700px;
      margin: 0 auto;
      text-align: left;
    }

    .performance-content h2 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 2rem;
      position: relative;
      padding-bottom: 0.5rem;
    }

    .performance-content h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 50px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
    }

    .performance-content p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      padding: 1rem;
      background: var(--card);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .performance-content p:hover {
      transform: translateX(5px);
      box-shadow: var(--shadow-md);
    }

    .performance-content p i {
      margin-right: 1rem;
      color: var(--accent);
      font-size: 1.5rem;
    }

    .download-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .download-btn:hover {
      background: var(--primary);
      transform: scale(1.05);
    }

    .download-btn i {
      color: #ffffff !important; /* Memastikan warna putih dengan prioritas tinggi */
    }

    .performance-image {
      max-width: 100%;
      margin: 2rem auto;
      text-align: center;
    }

    .performance-image img {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      transition: var(--transition);
    }

    .performance-image img:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-md), 0 0 15px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
      .performance-content h2 { font-size: 1.75rem; }
      .performance-content p { font-size: 1rem; padding: 0.75rem; }
      .performance-image img { max-width: 90%; }
    }
  </style>
</head>
<body>
  <!-- Load Header -->
  <script>
    fetch('../layout/header.html')
      .then(response => {
        if (!response.ok) throw new Error('Header not found: ' + response.status);
        return response.text();
      })
      .then(data => document.body.insertAdjacentHTML('afterbegin', data))
      .catch(error => console.error('Error loading header:', error));
  </script>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1>Indikator Kinerja Utama</h1>
      <p>Jelajahi capaian kinerja Dinas Komunikasi dan Informatika Banyumas.</p>
    </div>
  </section>

  <!-- Content Section -->
  <section class="content-section">
    <div class="container">
      <div class="performance-content">
        <h2>Indikator Kinerja Utama (IKU)</h2>
        <p><i class="fas fa-chart-line"></i> Indikator Kinerja Utama Kominfo Tahun 2021 bisa download disini <button class="download-btn" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> <i class="fas fa-download"></i> Download PDF</button></p>
      </div>
      <!-- <div class="performance-image">
        <img src="../images/STOK-Dinkominfo-2024.jpg" alt="Gambar Indikator Kinerja Dinkominfo Banyumas" />
      </div> -->
    </div>
  </section>

  <!-- Load Footer -->
  <script>
    fetch('../layout/footer.html')
      .then(response => {
        if (!response.ok) throw new Error('Footer not found: ' + response.status);
        return response.text();
      })
      .then(data => document.body.insertAdjacentHTML('beforeend', data))
      .catch(error => {
        console.error('Error loading footer:', error);
        document.body.insertAdjacentHTML('beforeend', `
          <footer style="background: var(--primary); color: white; padding: 2rem 0; font-family: 'Poppins', sans-serif;">
            <div class="container">
              <p style="text-align: center; font-size: 0.85rem;">© 2025 Dinkominfo Banyumas. All rights reserved.</p>
            </div>
          </footer>
        `);
      });
  </script>

  <!-- JavaScript untuk Download PDF -->
  <script>
    function downloadPDF() {
      const link = document.createElement('a');
      link.href = '../files/IKU-Dinkominfo-Banyumas-2021.pdf';
      link.download = 'IKU-Dinkominfo-Banyumas-2021.pdf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
