<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buku Tamu - Dinas Komunikasi dan Informatika Kab. Banyumas</title>
  <base href="/project-template-web-dinkominfo-bms/">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    .guestbook-form {
      max-width: 700px;
      margin: 2rem auto;
      background: var(--card);
      padding: 2.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }

    .guestbook-form h3 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 2rem;
      font-size: 1.8rem;
    }

    .form-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .form-group i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 1.2rem;
      z-index: 2;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-light);
      font-size: 1rem;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0, 61, 153, 0.15);
    }

    .form-group textarea {
      min-height: 140px;
      resize: vertical;
    }

    .captcha-group {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .captcha-img {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem;
      background: white;
    }

    .captcha-input {
      flex: 1;
    }

    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      width: 100%;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .btn-submit:hover {
      background: var(--primary-light);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>

  <!-- STABILO CURSOR -->
  <div id="cursor-highlight" class="cursor-highlight"></div>

  <!-- TOGGLE AKSESIBILITAS -->
  <div class="toggle-container">
    <div style="position: relative;">
      <button id="accessibility-toggle" class="toggle-btn" title="Aksesibilitas">
        <i class="fas fa-universal-access"></i>
      </button>
      <div id="accessibility-panel" class="accessibility-panel">
        <div class="acc-item" data-mode="contrast">Kontras</div>
        <div class="acc-item" data-mode="dark">Mode Gelap</div>
        <div class="acc-item" data-mode="highlight">Stabilo</div>
        <div class="acc-item" data-mode="guideline">Garis Panduan</div>
        <div class="acc-item" data-mode="reset">Reset</div>
      </div>
    </div>
  </div>

  <!-- PAGE WRAPPER -->
  <div class="page-wrapper">

    <!-- HEADER DINAMIS -->
    <div id="header-placeholder">Loading header...</div>

    <!-- HERO SECTION -->
    <section class="hero-section">
      <div class="container">
        <div class="hero-content">
          <div class="qa-icon">
            <i class="fas fa-book-open"></i>
          </div>
          <h1 class="hero-title">BUKU TAMU DIGITAL</h1>
          <p class="hero-subtitle">
            Tinggalkan pesan, kritik, saran, atau kesan Anda terhadap layanan Dinas Komunikasi dan Informatika Kabupaten Banyumas
          </p>
        </div>
      </div>
    </section>

    <!-- MAIN CONTENT -->
    <section class="main-content">
      <div class="container">
        <div class="info-card">

          <div class="guestbook-form">
            <h3>Isi Buku Tamu</h3>
            <form action="#" method="post">
              <div class="form-group">
                <i class="fas fa-user"></i>
                <input type="text" name="nama" placeholder="Nama Lengkap" required>
              </div>
              <div class="form-group">
                <i class="fas fa-phone-alt"></i>
                <input type="tel" name="telp" placeholder="Nomor Telepon / WhatsApp" required>
              </div>
              <div class="form-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Alamat Email" required>
              </div>
              <div class="form-group">
                <i class="fas fa-comment-dots"></i>
                <textarea name="komentar" placeholder="Pesan / Kritik / Saran" required></textarea>
              </div>

              <div class="captcha-group">
                <img src="https://via.placeholder.com/160x60/3366cc/ffffff?text=CAPTCHA" alt="CAPTCHA" class="captcha-img">
                <div class="form-group captcha-input">
                  <input type="text" name="captcha" placeholder="Masukkan kode CAPTCHA" required>
                </div>
              </div>

              <button type="submit" class="btn-submit">
                <i class="fas fa-paper-plane"></i> Kirim Pesan
              </button>
            </form>
          </div>

        </div>
      </div>
    </section>

    <!-- FOOTER DINAMIS -->
    <div id="footer-placeholder">Loading footer...</div>
  </div>

  <!-- SCRIPT AKSESIBILITAS & LOAD HEADER/FOOTER -->
  <script>
    // Toggle Aksesibilitas
    const accToggle = document.getElementById('accessibility-toggle');
    const accPanel = document.getElementById('accessibility-panel');
    accToggle.addEventListener('click', () => accPanel.classList.toggle('active'));
    document.addEventListener('click', (e) => {
      if (!accToggle.contains(e.target) && !accPanel.contains(e.target)) {
        accPanel.classList.remove('active');
      }
    });

    // Stabilo Cursor
    const cursorHighlight = document.getElementById('cursor-highlight');
    let isHighlightActive = false;
    document.addEventListener('mousemove', (e) => {
      if (isHighlightActive) {
        cursorHighlight.style.left = e.clientX + 'px';
        cursorHighlight.style.top = e.clientY + 'px';
      }
    });

    // Mode Aksesibilitas
    document.querySelectorAll('.acc-item').forEach(item => {
      item.addEventListener('click', () => {
        const mode = item.getAttribute('data-mode');
        document.body.classList.remove('high-contrast', 'dark-mode', 'guideline-mode');
        cursorHighlight.classList.remove('active');
        isHighlightActive = false;
        document.querySelectorAll('.acc-item').forEach(i => i.classList.remove('active'));

        if (mode === 'contrast') { document.body.classList.add('high-contrast'); item.classList.add('active'); }
        else if (mode === 'dark') { document.body.classList.add('dark-mode'); item.classList.add('active'); }
        else if (mode === 'highlight') { isHighlightActive = true; cursorHighlight.classList.add('active'); item.classList.add('active'); }
        else if (mode === 'guideline') { document.body.classList.add('guideline-mode'); item.classList.add('active'); }
      });
    });

    // Load Header & Footer Dinamis
    fetch('layout/header.html?v=' + Date.now())
      .then(r => r.text())
      .then(d => document.getElementById('header-placeholder').outerHTML = d);

    fetch('layout/footer.html?v=' + Date.now())
      .then(r => r.text())
      .then(d => document.getElementById('footer-placeholder').outerHTML = d);
  </script>
</body>
</html>
