<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dinkominfo Banyumas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --primary: #003d99;
      --primary-light: #0052cc;
      --accent: #0066ff;
      --text: #1a1a1a;
      --text-light: #666666;
      --bg: #ffffff;
      --bg-light: #f8f9fb;
      --card: #ffffff;
      --border: #e0e0e0;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
      --radius: 0.75rem;
      --transition: all 0.3s ease;
    }

    [data-theme="dark"] {
      --text: #f5f5f5;
      --text-light: #b0b0b0;
      --bg: #0f1117;
      --bg-light: #161b22;
      --card: #1c2128;
      --border: #30363d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: var(--transition);
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    @media (max-width: 768px) {
      .container { padding: 0 1rem; }
    }

    /* Topbar */
    .topbar {
      background: var(--primary);
      color: white;
      padding: 0.875rem 0;
      font-size: 0.875rem;
    }

    .topbar-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-weight: 600;
    }

    .topbar-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
    }

    .topbar-info h4 {
      font-size: 0.9rem;
      margin-bottom: 0.125rem;
      font-weight: 700;
    }

    .topbar-info p {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .topbar-right {
      display: none;
      gap: 1.5rem;
      font-size: 0.85rem;
    }

    @media (min-width: 768px) {
      .topbar-right { display: flex; }
    }

    /* Navigation */
    nav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .nav-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 3.75rem;
    }

    .nav-items {
      display: none;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
    }

    @media (min-width: 768px) {
      .nav-items { display: flex; }
    }

    .nav-items a {
      padding: 0.5rem 1rem;
      color: var(--text);
      text-decoration: none;
      border-radius: var(--radius);
      transition: var(--transition);
      position: relative;
    }

    .nav-items a:hover {
      background: var(--bg-light);
      color: var(--primary);
    }

    .nav-items a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 1rem;
      right: 1rem;
      height: 2px;
      background: var(--primary);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .nav-items a:hover::after {
      transform: scaleX(1);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-icon {
      background: none;
      border: none;
      padding: 0.5rem;
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--text);
      transition: var(--transition);
      font-weight: 600;
    }

    .btn-icon:hover {
      background: var(--bg-light);
      color: var(--primary);
    }

    .menu-toggle {
      display: block;
    }

    @media (min-width: 768px) {
      .menu-toggle { display: none; }
    }

    .mobile-nav {
      display: none;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 0.75rem 0;
    }

    .mobile-nav.active {
      display: block;
    }

    .mobile-nav a {
      display: block;
      padding: 0.875rem 1.5rem;
      color: var(--text);
      text-decoration: none;
      border-radius: 0;
      transition: var(--transition);
      font-weight: 600;
    }

    .mobile-nav a:hover {
      background: var(--bg-light);
      color: var(--primary);
    }

    .theme-toggle {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 1.15rem;
      padding: 0.5rem;
      border-radius: var(--radius);
      transition: var(--transition);
    }

    .theme-toggle:hover {
      background: var(--bg-light);
      color: var(--primary);
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <div class="container topbar-content">
      <div class="topbar-left">
        <div class="topbar-logo">DI</div>
        <div class="topbar-info">
          <h4>Dinas Komunikasi dan Informatika</h4>
          <p>Pemerintah Kabupaten Banyumas</p>
        </div>
      </div>
      <div class="topbar-right">
        <span>Jl. Masjid No. 8 Purwokerto</span>
        <span>|</span>
        <span>Telp: (0281) 632338</span>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav>
    <div class="container nav-content">
      <div class="nav-items">
        <a href="#beranda">Beranda</a>
        <a href="#profil">Profil</a>
        <a href="#ppid">PPID</a>
        <a href="#layanan">Layanan</a>
        <a href="#berita">Berita</a>
        <a href="#kontak">Kontak</a>
      </div>
      <div class="nav-actions">
        <button class="btn-icon theme-toggle" onclick="toggleTheme()" aria-label="Ganti tema">
          <i class="fas fa-moon"></i>
        </button>
        <button class="btn-icon menu-toggle" onclick="toggleMobileMenu()">Menu</button>
      </div>
    </div>
    <div class="mobile-nav" id="mobileNav">
      <a href="#beranda">Beranda</a>
      <a href="#profil">Profil</a>
      <a href="#ppid">PPID</a>
      <a href="#layanan">Layanan</a>
      <a href="#berita">Berita</a>
      <a href="#kontak">Kontak</a>
    </div>
  </nav>

  <script>
    function toggleMobileMenu() {
      document.getElementById('mobileNav').classList.toggle('active');
    }

    function toggleTheme() {
      const body = document.body;
      const current = body.getAttribute('data-theme');
      const icon = document.querySelector('.theme-toggle i');
      
      if (current === 'dark') {
        body.removeAttribute('data-theme');
        icon.classList.replace('fa-sun', 'fa-moon');
      } else {
        body.setAttribute('data-theme', 'dark');
        icon.classList.replace('fa-moon', 'fa-sun');
      }
    }

    window.addEventListener('load', () => {
      const icon = document.querySelector('.theme-toggle i');
      if (document.body.getAttribute('data-theme') === 'dark') {
        icon.classList.replace('fa-moon', 'fa-sun');
      }
    });
  </script>
