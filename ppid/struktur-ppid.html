<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Struktur PPID - Dinas Komunikasi dan Informatika Kab. Banyumas</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root {
      --primary: #003d99;
      --primary-light: #0052cc;
      --accent: #0066ff;
      --gold: #ffcc00;
      --text: #1a1a1a;
      --text-light: #555555;
      --bg: #f8fbff;
      --bg-light: #eef4ff;
      --card: #ffffff;
      --border: #d0e0ff;
      --shadow-sm: 0 4px 12px rgba(0, 61, 153, 0.08);
      --shadow-md: 0 12px 32px rgba(0, 61, 153, 0.15);
      --shadow-lg: 0 16px 48px rgba(0, 61, 153, 0.25);
      --radius: 1.5rem;
      --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .high-contrast {
      --text: #ffffff; --text-light: #cccccc; --bg: #000; --bg-light: #111; --card: #000; --border: #444; --primary: #00ccff; --accent: #00ff59;
    }
    .dark-mode {
      --text: #e0e0e0; --text-light: #aaa; --bg: #121212; --bg-light: #1e1e1e; --card: #1f1f1f; --border: #333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: var(--transition);
      position: relative;
      min-height: 100vh;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    @media (max-width: 768px) {
      .container { padding: 0 1.5rem; }
    }

    /* HERO */
    .hero-section {
      background: linear-gradient(135deg, rgba(0,61,153,0.9), rgba(0,102,255,0.7)), url('images/galeri4.jpg') center/cover;
      color: white;
      padding: 3rem 0 3.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.2);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero-title {
      font-size: 2.6rem;
      font-weight: 800;
      margin-bottom: 0.8rem;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .hero-subtitle {
      font-size: 1.15rem;
      opacity: 0.95;
      max-width: 700px;
      margin: 0 auto 1.5rem;
    }

    .ppid-icon {
      width: 80px;
      height: 80px;
      background: var(--accent);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin: 0 auto 1.2rem;
      box-shadow: 0 0 25px rgba(0,102,255,0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 25px rgba(0,102,255,0.6); }
      50% { box-shadow: 0 0 40px rgba(0,102,255,0.9); }
      100% { box-shadow: 0 0 25px rgba(0,102,255,0.6); }
    }

    /* MAIN CONTENT */
    .main-content {
      padding: 2.5rem 0 5rem;
      flex: 1;
    }

    .info-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }

    .info-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .info-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
      border-color: var(--accent);
    }

    .card-title {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 1.5rem;
      text-align: center;
      font-weight: 800;
    }

    /* GAMBAR STRUKTUR */
    .struktur-img {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      transition: var(--transition);
      cursor: zoom-in;
      margin: 1.5rem 0;
    }

    .struktur-img:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-lg);
    }

    .img-caption {
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-light);
      margin-top: 0.8rem;
      font-style: italic;
    }

    /* ZOOM MODAL */
    .image-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      overflow: auto;
    }

    .image-modal.active {
      display: flex;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90%;
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      position: relative;
    }

    .modal-img {
      width: 100%;
      height: auto;
      border-radius: var(--radius);
    }

    .close-modal {
      position: absolute;
      top: -15px;
      right: -15px;
      width: 48px;
      height: 48px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      transition: var(--transition);
    }

    .close-modal:hover {
      background: var(--primary);
      transform: scale(1.1);
    }

    /* INFO BOX */
    .info-box {
      background: linear-gradient(135deg, #fff8e1, #fff0c2);
      border: 1px solid #ffcc00;
      border-radius: var(--radius);
      padding: 1.5rem;
      text-align: center;
      margin: 2rem 0;
      box-shadow: var(--shadow-sm);
    }

    .info-box i {
      font-size: 2rem;
      color: var(--gold);
      margin-bottom: 0.6rem;
    }

    .info-box p {
      font-size: 1rem;
      color: #5d4037;
      margin: 0;
      font-weight: 500;
    }

    /* PAGE WRAPPER */
    .page-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* AKSESIBILITAS */
    .toggle-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }

    .toggle-btn {
      width: 56px;
      height: 56px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      transition: var(--transition);
    }

    .toggle-btn:hover {
      background: var(--primary-light);
      transform: translateY(-3px);
    }

    .accessibility-panel {
      position: absolute;
      top: 70px;
      right: 0;
      width: 240px;
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      display: none;
      flex-direction: column;
      z-index: 10000;
    }

    .accessibility-panel.active {
      display: flex;
    }

    .acc-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      transition: var(--transition);
      border-bottom: 1px solid #eee;
    }

    .acc-item:last-child { border-bottom: none; }
    .acc-item:hover { background: #f0f4ff; color: var(--primary); }
    .acc-item i { 
      width: 36px; height: 36px; background: var(--primary); color: white; 
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; 
    }
    .acc-item.active { background: var(--accent); color: white; }
    .acc-item.active i { background: white; color: var(--accent); }

    /* STABILO */
    .cursor-highlight {
      position: fixed;
      width: 120px;
      height: 40px;
      background: rgba(255, 255, 0, 0.4);
      border-radius: 20px;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      transition: all 0.1s ease;
      display: none;
    }

    .cursor-highlight.active { display: block; }

    /* PLACEHOLDER */
    #header-placeholder, #footer-placeholder {
      min-height: 60px;
      background: #f0f4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-weight: 600;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- STABILO -->
  <div id="cursor-highlight" class="cursor-highlight"></div>

  <!-- TOGGLE AKSESIBILITAS -->
  <div class="toggle-container">
    <div style="position: relative;">
      <button id="accessibility-toggle" class="toggle-btn" title="Aksesibilitas">
        <i class="fas fa-universal-access"></i>
      </button>
      <div id="accessibility-panel" class="accessibility-panel">
        <div class="acc-item" data-mode="contrast"><i class="fas fa-adjust"></i> Kontras</div>
        <div class="acc-item" data-mode="dark"><i class="fas fa-moon"></i> Mode Gelap</div>
        <div class="acc-item" data-mode="highlight"><i class="fas fa-highlighter"></i> Stabilo</div>
        <div class="acc-item" data-mode="guideline"><i class="fas fa-ruler"></i> Garis Panduan</div>
        <div class="acc-item" data-mode="reset"><i class="fas fa-undo"></i> Reset</div>
      </div>
    </div>
  </div>

  <!-- MODAL ZOOM GAMBAR -->
  <div id="image-modal" class="image-modal">
    <div class="modal-content">
      <button class="close-modal" id="close-modal">
        <i class="fas fa-times"></i>
      </button>
      <img src="../images/struktur_ppid.jpg" alt="Struktur PPID" class="modal-img" />
    </div>
  </div>

  <!-- PAGE WRAPPER -->
  <div class="page-wrapper">

    <!-- HEADER -->
    <div id="header-placeholder">Loading header...</div>

    <!-- HERO -->
    <section class="hero-section">
      <div class="container">
        <div class="hero-content">
          <div class="ppid-icon">
            <i class="fas fa-sitemap"></i>
          </div>
          <h1 class="hero-title">Struktur PPID</h1>
          <p class="hero-subtitle">
            Bagian Tim Pengelola Layanan Informasi dan Dokumentasi (PPID)
          </p>
        </div>
      </div>
    </section>

    <!-- MAIN CONTENT -->
    <section class="main-content">
      <div class="container">
        <div class="info-card">
          <h2 class="card-title">Struktur Organisasi PPID</h2>
          
          <img 
            src="../images/struktur_ppid.jpg" 
            alt="Struktur PPID Dinas Komunikasi dan Informatika Kabupaten Banyumas" 
            class="struktur-img"
            id="zoom-image"
          />
          
          <p class="img-caption">
            <i class="fas fa-info-circle"></i> 
            Klik gambar untuk memperbesar
          </p>

          
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <div id="footer-placeholder">Loading footer...</div>
  </div>

  <!-- SCRIPT -->
  <script>
    // AKSESIBILITAS
    const accToggle = document.getElementById('accessibility-toggle');
    const accPanel = document.getElementById('accessibility-panel');
    accToggle.addEventListener('click', () => accPanel.classList.toggle('active'));
    document.addEventListener('click', (e) => {
      if (!accToggle.contains(e.target) && !accPanel.contains(e.target)) {
        accPanel.classList.remove('active');
      }
    });

    // STABILO
    const cursorHighlight = document.getElementById('cursor-highlight');
    let isHighlightActive = false;
    document.addEventListener('mousemove', (e) => {
      if (isHighlightActive) {
        cursorHighlight.style.left = e.clientX + 'px';
        cursorHighlight.style.top = e.clientY + 'px';
      }
    });

    document.querySelectorAll('.acc-item').forEach(item => {
      item.addEventListener('click', () => {
        const mode = item.getAttribute('data-mode');
        document.body.classList.remove('high-contrast', 'dark-mode', 'guideline-mode');
        cursorHighlight.classList.remove('active');
        isHighlightActive = false;
        document.querySelectorAll('.acc-item').forEach(i => i.classList.remove('active'));

        if (mode === 'contrast') { document.body.classList.add('high-contrast'); item.classList.add('active'); }
        else if (mode === 'dark') { document.body.classList.add('dark-mode'); item.classList.add('active'); }
        else if (mode === 'highlight') { isHighlightActive = true; cursorHighlight.classList.add('active'); item.classList.add('active'); }
        else if (mode === 'guideline') { document.body.classList.add('guideline-mode'); item.classList.add('active'); }
      });
    });

    // ZOOM GAMBAR
    const zoomImg = document.getElementById('zoom-image');
    const modal = document.getElementById('image-modal');
    const closeModal = document.getElementById('close-modal');

    zoomImg.addEventListener('click', () => {
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    });

    closeModal.addEventListener('click', () => {
      modal.classList.remove('active');
      document.body.style.overflow = 'auto';
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
        document.body.style.overflow = 'auto';
      }
    });

    // LOAD HEADER & FOOTER
    fetch('../layout/header.html')
      .then(r => r.text())
      .then(d => document.getElementById('header-placeholder').outerHTML = d)
      .catch(() => document.getElementById('header-placeholder').innerHTML = '<p style="color:red; text-align:center;">Gagal memuat header</p>');

    fetch('../layout/footer.html')
      .then(r => r.text())
      .then(d => document.getElementById('footer-placeholder').outerHTML = d)
      .catch(() => document.getElementById('footer-placeholder').innerHTML = '<p style="color:red; text-align:center;">Gagal memuat footer</p>');
  </script>
</body>
</html>
